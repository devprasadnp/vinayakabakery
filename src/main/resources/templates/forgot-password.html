<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Forgot password')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="section">
    <div class="wrap-narrow">
        <h2 class="center">Forgot your password?</h2>
        <p class="center muted">Enter the email you signed up with and we will send you a link to choose a new one.</p>

        <form class="panel mt-4" th:action="@{/forgot-password}" method="post">
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required autofocus autocomplete="username" maxlength="160">
            </div>
            <button class="btn lg block" type="submit">Email me a reset link</button>
            <p class="center muted small mt-4 mb-0">
                Remembered it? <a th:href="@{/login}">Back to sign in</a>
            </p>
        </form>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
