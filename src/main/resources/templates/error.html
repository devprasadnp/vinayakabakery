<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Something went wrong')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>

<div class="section">
    <div class="wrap-narrow">
        <div class="empty">
            <div class="ico">🫙</div>
            <h3 th:text="${status} ?: 'Something went wrong'">Something went wrong</h3>
            <p th:text="${message} ?: 'That page could not be loaded.'"></p>
            <div class="btn-row" style="justify-content:center">
                <a class="btn" th:href="@{/}">Back to the shop</a>
                <a class="btn ghost" th:href="@{/products}">Browse foods</a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
