<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/panel :: head('Mail')}"></head>
<body>
<div class="shell">
    <aside th:replace="~{fragments/panel :: sidebar('mail')}"></aside>

    <main class="work">
        <div class="topbar">
            <div>
                <h1 th:text="${message != null} ? (${message.subject} ?: '(no subject)') : 'Message'">Subject</h1>
                <div class="crumb" th:text="${folder == 'sent'} ? 'Sent' : 'Inbox'">Inbox</div>
            </div>
            <a class="btn ghost" th:href="@{/admin/mail(folder=${folder})}">&larr; Back to mail</a>
        </div>

        <div class="work-body">
            <div th:replace="~{fragments/panel :: flash}"></div>

            <div class="notice bad" th:if="${mailError}">
                <span class="ico">&#9888;</span><span th:text="${mailError}"></span>
            </div>

            <div class="card" th:if="${message != null}">
                <div class="body">
                    <p class="muted small mb-0" th:text="|From: ${message.from}|"></p>
                    <p class="muted small mb-0" th:text="|To: ${message.to}|"></p>
                    <p class="muted small" th:if="${message.sentDate != null}"
                       th:text="|${#temporals.format(message.sentDate, 'dd MMM yyyy, HH:mm')}|"></p>
                    <hr>
                    <div style="white-space:pre-wrap" th:text="${message.bodyText}"></div>
                </div>
            </div>
        </div>
    </main>
</div>
</body>
</html>
