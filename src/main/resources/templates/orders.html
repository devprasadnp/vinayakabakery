<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('My orders')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('orders')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="wrap section">
    <div class="section-head">
        <div><h2>My orders</h2><p>Every jar you have ordered, newest first.</p></div>
        <a class="btn ghost" th:href="@{/products}">Order again</a>
    </div>

    <div class="empty" th:if="${orders.isEmpty()}">
        <div class="ico">📦</div>
        <h3>No orders yet</h3>
        <p>When you place one, it will show up here with live delivery status.</p>
        <a class="btn" th:href="@{/products}">Browse the foods</a>
    </div>

    <div class="table-wrap" th:unless="${orders.isEmpty()}">
        <div class="table-scroll">
            <table class="data">
                <thead>
                <tr><th>Order</th><th>Placed</th><th>Jars</th><th class="num">Total</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}">
                    <td><strong th:text="${o.orderNumber}">HP-…</strong></td>
                    <td class="nowrap" th:text="${#temporals.format(o.placedAt, 'dd MMM yyyy, HH:mm')}"></td>
                    <td th:text="${o.totalQuantity}">0</td>
                    <td class="num nowrap" th:text="${T(com.harish.pickles.dto.Money).format(o.totalPaise)}">₹0</td>
                    <td><span class="status" th:classappend="${o.status.name()}" th:text="${o.status}">PAID</span></td>
                    <td><a class="btn ghost sm" th:href="@{'/orders/' + ${o.orderNumber}}">View</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
