<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Choose a new password')}"></head>
<body>
<header th:replace="~{fragments/layout :: header('')}"></header>
<div th:replace="~{fragments/layout :: flash}"></div>

<div class="section">
    <div class="wrap-narrow">
        <!-- ================================================ link is good -->
        <th:block th:if="${tokenValid}">
            <h2 class="center">Choose a new password</h2>
            <p class="center muted">Use at least 8 characters. This link works only once.</p>

            <form class="panel mt-4" th:action="@{/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="field">
                    <label for="password">New password</label>
                    <input id="password" name="password" type="password" required minlength="8" maxlength="72"
                           autofocus autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="confirmPassword">Confirm new password</label>
                    <input id="confirmPassword" name="confirmPassword" type="password" required minlength="8"
                           maxlength="72" autocomplete="new-password">
                </div>
                <button class="btn lg block" type="submit">Change password</button>
            </form>
        </th:block>

        <!-- ========================================= link is bad or spent -->
        <th:block th:unless="${tokenValid}">
            <h2 class="center">This link can't be used</h2>
            <p class="center muted">Reset links expire after an hour and work only once.</p>
            <div class="center mt-4">
                <a class="btn lg" th:href="@{/forgot-password}">Get a new link</a>
            </div>
        </th:block>
    </div>
</div>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
